<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirSense · Chemistry lab</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..600&display=swap');

  :root {
    color-scheme: light;
    --paper: #ffffff;
    --tint: #f6faf7;
    --ink: #101f18;
    --muted: #64796c;
    --muted-2: #8b9c92;
    --green: #1f7a4f;
    --green-soft: rgba(31, 122, 79, .08);
    --line: #e2ede7;
    --line-soft: #edf4f0;
    --display: 'Fraunces', Georgia, serif;
    --body: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; background: transparent;
    font-family: var(--body); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #lab {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 4px);
    padding: clamp(16px, 2.6vw, 26px);
    border: 1px solid var(--line);
    border-radius: 26px;
    background:
      radial-gradient(55% 80% at 92% -8%, rgba(31, 122, 79, .07), transparent 68%),
      linear-gradient(160deg, #ffffff, #f7fbf8);
    overflow: hidden;
  }
  .lab-top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-shrink: 0; padding-bottom: 2px; }
  .lab-top span { color: var(--muted-2); font-size: 10.5px; letter-spacing: .02em; }
  .lab-top b { color: var(--ink); font-weight: 600; }

  .choices { display: flex; gap: 7px; overflow-x: auto; padding: 14px 1px 12px; scrollbar-width: none; flex-shrink: 0; }
  .choices::-webkit-scrollbar { display: none; }
  .choice {
    flex: 0 0 auto; min-width: 92px; min-height: 54px; padding: 9px 11px;
    color: var(--muted); text-align: left; cursor: pointer;
    border: 1px solid var(--line); border-radius: 13px;
    background: rgba(255, 255, 255, .8);
    transition: border-color .16s ease, background .16s ease, transform .16s ease;
  }
  .choice:hover, .choice:focus-visible { border-color: rgba(31, 122, 79, .4); outline: none; }
  .choice[aria-pressed="true"] {
    color: var(--ink); border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 9%, white);
  }
  .choice-formula { display: block; color: var(--accent); font-size: 15px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .choice-name { display: block; margin-top: 3px; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .content { display: grid; grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr); gap: 14px; flex: 1; min-height: 0; }
  .stage, .details { border: 1px solid var(--line); border-radius: 18px; min-height: 0; }
  .stage {
    position: relative; overflow: hidden;
    background: radial-gradient(circle at 50% 45%, rgba(31, 122, 79, .09), transparent 62%), #fbfdfb;
  }
  #molecule-3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #molecule-3d:active { cursor: grabbing; }
  .stage-hint {
    position: absolute; left: 12px; top: 11px;
    font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted-2); pointer-events: none;
  }
  .stage-foot {
    position: absolute; left: 12px; right: 12px; bottom: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 9.5px; color: var(--muted-2); pointer-events: none;
  }
  .stage-foot b { color: var(--muted); font-weight: 500; }
  .reset {
    pointer-events: auto; border: 1px solid var(--line); background: rgba(255,255,255,.9);
    color: var(--muted); border-radius: 999px; padding: 3px 9px; font: inherit; font-size: 9.5px;
    cursor: pointer;
  }
  .reset:hover { color: var(--green); border-color: rgba(31,122,79,.35); }
  .svg-fallback { position: absolute; inset: 0; display: none; place-items: center; padding: 16px; }
  .svg-fallback svg { width: min(100%, 230px); height: auto; }

  .details { display: flex; flex-direction: column; padding: 15px 16px; overflow: auto; background: rgba(255,255,255,.7); }
  .details::-webkit-scrollbar { width: 5px; }
  .details::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }
  .detail-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .detail-kicker { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-2); }
  .detail-title { margin-top: 4px; font-family: var(--display); font-size: 21px; letter-spacing: -.02em; font-weight: 400; }
  .detail-formula { margin-top: 3px; color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: .01em; }
  .reading {
    flex: 0 0 auto; min-width: 96px; padding: 7px 9px; text-align: right;
    border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
    border-radius: 11px; background: color-mix(in srgb, var(--accent) 6%, transparent);
  }
  .reading-value { display: block; color: var(--accent); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .reading-label { display: block; margin-top: 2px; color: var(--muted-2); font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase; }
  .role { margin: 10px 0 0; color: #44594c; font-size: 12px; line-height: 1.6; }
  .who { display: flex; align-items: center; gap: 9px; margin-top: 11px; }
  .who-track { flex: 1; height: 5px; border-radius: 999px; background: var(--line-soft); overflow: hidden; }
  .who-track i { display: block; height: 100%; border-radius: 999px; background: var(--accent); opacity: .8; }
  .who-text { flex: 0 0 auto; color: var(--muted-2); font-size: 9.5px; letter-spacing: .01em; white-space: nowrap; }
  .who-text b { color: var(--accent); font-weight: 600; }
  .structure { margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line-soft); }
  .structure p { margin: 4px 0 0; color: var(--muted); font-size: 10.5px; line-height: 1.55; }
  .fact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .detail-foot { margin-top: auto; padding-top: 12px; color: var(--muted-2); font-size: 8.5px; letter-spacing: .04em; }
  .fact { padding: 10px; border: 1px solid var(--line-soft); border-radius: 12px; background: rgba(246, 250, 247, .8); }
  .fact-label { display: block; color: var(--green); font-size: 8.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
  .fact p { margin: 5px 0 0; color: var(--muted); font-size: 10.5px; line-height: 1.55; }

  @media (max-width: 780px) {
    #lab { height: calc(100vh - 4px); padding: 15px; border-radius: 20px; }
    .lab-top { display: none; }
    .content { grid-template-columns: 1fr; grid-template-rows: minmax(160px, .85fr) minmax(0, 1.15fr); gap: 10px; }
    .details { padding: 13px 14px; }
    .fact-grid { grid-template-columns: 1fr 1fr; }
    .role { font-size: 11.5px; }
    .detail-title { font-size: 19px; }
  }
</style>
</head>
<body>
<section id="lab" aria-label="Interactive pollutant chemistry lab">
  <div class="lab-top">
    <span>Choose a <b>pollutant</b></span>
    <span>Drag the structure to turn it · scroll to zoom</span>
  </div>

  <div class="choices" id="choices" role="group" aria-label="Choose a pollutant"></div>

  <div class="content">
    <div class="stage" id="stage">
      <canvas id="molecule-3d" aria-label="Rotatable 3D molecular structure"></canvas>
      <div class="svg-fallback" id="fallback"></div>
      <div class="stage-hint">Drag to rotate · scroll to zoom</div>
      <div class="stage-foot">
        <span><b id="stage-name">—</b> <span id="stage-note"></span></span>
        <button class="reset" id="reset" type="button">Reset view</button>
      </div>
    </div>
    <article class="details" id="details" aria-live="polite"></article>
  </div>
</section>

<script type="module">
(() => {
  "use strict";

  const STATE = __AIRSENSE_CHEMISTRY_STATE__;
  const values = (STATE && STATE.readings) || {};
  const safeNumber = value => (value === null || value === undefined || value === "" ? null : (Number.isFinite(Number(value)) ? Number(value) : null));
  const format = value => {
    const number = safeNumber(value);
    return number === null ? "Not measured" : `${number >= 100 ? number.toFixed(0) : number.toFixed(1)} µg/m³`;
  };

  /* ---------------------------------------------------------- molecules */

  const ATOM = {
    N: { color: "#5f83ad", size: .46 },
    O: { color: "#cf6f63", size: .43 },
    S: { color: "#d3ab3d", size: .56 },
    C: { color: "#4f6357", size: .42 },
    H: { color: "#dbe6df", size: .26 },
  };

  const MOLECULES = {
    pm2_5: {
      label: "PM₂.₅",
      name: "Fine particles",
      note: "A mixture, not a molecule",
      cluster: true,
      atoms: [
        [0, 0, 0, .62, "#7d8a82"], [1.05, .55, .2, .4, "#9a8f7a"], [-.95, .75, -.2, .34, "#6f7f76"],
        [.2, 1.15, .35, .3, "#a98f6e"], [-.55, -.95, .3, .42, "#88957f"], [1.2, -.6, -.25, .28, "#7b8276"],
        [-1.3, -.35, .15, .24, "#a5957c"], [.65, -.55, .9, .2, "#69766e"], [1.75, .25, -.55, .18, "#8e8a76"],
      ],
    },
    nitrogen_dioxide: {
      label: "NO₂",
      name: "Nitrogen dioxide",
      note: "Bent · 134°",
      atoms: [[0, -.28, 0, "N"], [1.16, .58, 0, "O"], [-1.16, .58, 0, "O"]],
      bonds: [[0, 1, 2], [0, 2, 1]],
    },
    ozone: {
      label: "O₃",
      name: "Ground-level ozone",
      note: "Bent · resonance",
      atoms: [[0, -.5, 0, "O"], [1.27, .42, 0, "O"], [-1.27, .42, 0, "O"]],
      bonds: [[0, 1, 2], [0, 2, 2]],
    },
    sulphur_dioxide: {
      label: "SO₂",
      name: "Sulphur dioxide",
      note: "Bent · 119°",
      atoms: [[0, -.42, 0, "S"], [1.28, .52, 0, "O"], [-1.28, .52, 0, "O"]],
      bonds: [[0, 1, 2], [0, 2, 2]],
    },
    carbon_monoxide: {
      label: "CO",
      name: "Carbon monoxide",
      note: "Linear · triple bond",
      atoms: [[-.68, 0, 0, "C"], [.68, 0, 0, "O"]],
      bonds: [[0, 1, 3]],
    },
    voc: {
      label: "VOC",
      name: "Volatile organics",
      note: "Benzene ring · one example",
      atoms: [0, 1, 2, 3, 4, 5].map(i => {
        const angle = (Math.PI / 3) * i - Math.PI / 2;
        return [Math.cos(angle) * 1.42, Math.sin(angle) * 1.42, (i % 2 ? .12 : -.12), "C"];
      }),
      bonds: [[0, 1, 2], [1, 2, 1], [2, 3, 2], [3, 4, 1], [4, 5, 2], [5, 0, 1]],
    },
  };

  const WHO = { pm2_5: 15, pm10: 45, nitrogen_dioxide: 25, ozone: 100, sulphur_dioxide: 40, carbon_monoxide: 4000 };

  const pollutants = [
    { id: "pm2_5", formula: "PM₂.₅", name: "Fine particles", accent: "#1f7a4f", value: values.pm2_5,
      role: "Everything airborne below 2.5 micrometres: soot, dust, salts, metals and organic material. It is a mixture, so no single structure describes it.",
      structure: "A size class rather than a molecule. The cluster stands in for particles of many shapes and compositions, drawn together only because they are small enough to reach deep into the lungs.",
      arises: "Combustion, road dust and fires emit particles directly. SO₂, NOₓ and ammonia also react in air to make secondary particles.",
      reduce: "Cut diesel soot and open burning, control industrial stacks, and move cooking and power to cleaner fuels." },
    { id: "nitrogen_dioxide", formula: "NO₂", name: "Nitrogen dioxide", accent: "#a87c25", value: values.nitrogen_dioxide,
      role: "A reactive nitrogen oxide and a sharp marker of nearby combustion. It also helps build ozone and nitrate particles.",
      structure: "Bent, with an O–N–O angle near 134° and one unpaired electron spread across the molecule — which is what makes it so willing to react.",
      arises: "High-temperature engines, generators, power plants and burners combine nitrogen and oxygen from the air.",
      reduce: "Cleaner transport and electricity, less idling, well-maintained combustion equipment and NOₓ controls at big sources." },
    { id: "ozone", formula: "O₃", name: "Ground-level ozone", accent: "#2c9d68", value: values.ozone,
      role: "A secondary gas that irritates airways when it sits near the ground — the same molecule is protective high in the stratosphere.",
      structure: "Bent at about 117°. The central oxygen carries a lone pair, giving ozone its sharp oxidising edge.",
      arises: "Sunlight splits NO₂ and the freed oxygen joins O₂. VOCs keep the cycle running, so ozone climbs through sunny afternoons.",
      reduce: "Cut NOₓ and VOCs together: cleaner vehicles, solvent recovery, fewer vapours and cleaner industry." },
    { id: "sulphur_dioxide", formula: "SO₂", name: "Sulphur dioxide", accent: "#8e6ba8", value: values.sulphur_dioxide,
      role: "A sulphur gas that irritates the respiratory system directly and oxidises into sulphate particles downwind.",
      structure: "Bent at roughly 119°, with two polar S=O bonds and a lone pair sitting on the sulphur atom.",
      arises: "Burning sulphur-bearing coal and oil, metal smelting and some industrial processes.",
      reduce: "Low-sulphur fuels, flue-gas desulphurisation and better industrial fuel quality." },
    { id: "carbon_monoxide", formula: "CO", name: "Carbon monoxide", accent: "#5f8790", value: values.carbon_monoxide,
      role: "Colourless, odourless and produced by incomplete combustion. It binds haemoglobin far more strongly than oxygen does.",
      structure: "Linear, with a triple bond between carbon and oxygen — the tightest common carbon–oxygen connection.",
      arises: "Vehicle exhaust, generators, biomass burning and any poorly ventilated flame.",
      reduce: "Maintain engines and generators, never burn fuel indoors or in enclosed spaces, and avoid open burning." },
    { id: "voc", formula: "VOC", name: "Volatile organics", accent: "#b4553f", value: null,
      role: "A large family of carbon-based gases. Benzene is one example; real urban mixtures contain hundreds of species with very different reactivity.",
      structure: "Benzene as the archetype: a flat hexagon of six carbons sharing delocalised π electrons, which is why it evaporates and reacts so readily.",
      arises: "Fuel evaporation, solvents, paints, industry, cooking and vegetation all release VOCs.",
      reduce: "Low-VOC paints and cleaners, vapour recovery, sealed containers and leak detection in industry." },
  ];

  /* ------------------------------------------------------------- markup */

  const choices = document.getElementById("choices");
  const details = document.getElementById("details");
  const stageName = document.getElementById("stage-name");
  const stageNote = document.getElementById("stage-note");
  const fallback = document.getElementById("fallback");
  const canvas = document.getElementById("molecule-3d");
  const resetButton = document.getElementById("reset");
  let active = pollutants[0];

  function renderChoices() {
    choices.innerHTML = pollutants.map(item => `
      <button type="button" class="choice" data-id="${item.id}" aria-pressed="${item.id === active.id}" style="--accent:${item.accent}">
        <span class="choice-formula">${item.formula}</span>
        <span class="choice-name">${item.name}</span>
      </button>`).join("");
    choices.querySelectorAll(".choice").forEach(button => {
      button.addEventListener("click", () => {
        active = pollutants.find(item => item.id === button.dataset.id) || active;
        render();
      });
    });
  }

  function whoLine() {
    const value = safeNumber(active.value);
    const guide = WHO[active.id];
    if (value === null || !guide) {
      return `<div class="who"><div class="who-track"><i style="width:0%"></i></div><span class="who-text">No WHO reference for this mixture</span></div>`;
    }
    const ratio = value / guide;
    const width = Math.min(ratio / 6, 1) * 100;
    const sentence = ratio < 1
      ? `<b>${ratio.toFixed(2)}×</b> WHO guideline`
      : `<b>${ratio.toFixed(1)}×</b> WHO guideline`;
    return `<div class="who"><div class="who-track"><i style="width:${width.toFixed(0)}%"></i></div><span class="who-text">${sentence}</span></div>`;
  }

  function renderDetails() {
    details.style.setProperty("--accent", active.accent);
    details.innerHTML = `
      <div class="detail-top">
        <div>
          <div class="detail-kicker">Pollutant profile</div>
          <div class="detail-title">${active.name}</div>
          <div class="detail-formula">${active.formula}</div>
        </div>
        <div class="reading"><span class="reading-value">${format(active.value)}</span><span class="reading-label">Reading now</span></div>
      </div>
      <p class="role">${active.role}</p>
      ${whoLine()}
      <div class="structure"><span class="fact-label">The structure</span><p>${active.structure}</p></div>
      <div class="fact-grid">
        <div class="fact"><span class="fact-label">Why it occurs</span><p>${active.arises}</p></div>
        <div class="fact"><span class="fact-label">What helps</span><p>${active.reduce}</p></div>
      </div>
      <div class="detail-foot">Live reading at your observation point · Open-Meteo CAMS model</div>`;
    stageName.textContent = active.formula;
    stageNote.textContent = "· " + (MOLECULES[active.id].note || "");
  }

  function render() {
    renderChoices();
    renderDetails();
    if (viewer) viewer.show(active.id);
  }

  /* ---------------------------------------------------------- 3D viewer */

  let viewer = null;

  class Viewer {
    constructor(THREE) {
      this.THREE = THREE;
      this.group = new THREE.Group();
      this.spin = 0.0035;
      this.dragging = false;
      this.last = null;
      this.zoom = 6.9;

      this.scene = new THREE.Scene();
      this.camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
      this.camera.position.set(0, 0, this.zoom);

      this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      this.scene.add(this.group);

      const hemi = new THREE.HemisphereLight(0xffffff, 0xa8c0b1, 1.9);
      const key = new THREE.DirectionalLight(0xffffff, 2.7);
      key.position.set(4, 5, 7);
      const fill = new THREE.DirectionalLight(0xdff0e6, 0.9);
      fill.position.set(-5, -3, 4);
      this.scene.add(hemi, key, fill);

      window.__airsenseViewer = this;
      this.resize();
      new ResizeObserver(() => this.resize()).observe(canvas.parentElement);
      this.bind();
      this.loop();
    }

    resize() {
      const box = canvas.parentElement.getBoundingClientRect();
      if (!box.width || !box.height) return;
      this.renderer.setSize(box.width, box.height, false);
      this.camera.aspect = box.width / box.height;
      this.camera.updateProjectionMatrix();
    }

    bind() {
      const point = event => (event.touches ? event.touches[0] : event);
      const down = event => {
        this.dragging = true;
        this.last = { x: point(event).clientX, y: point(event).clientY };
        canvas.setPointerCapture?.(event.pointerId);
      };
      const move = event => {
        if (!this.dragging) return;
        const p = point(event);
        const dx = p.clientX - this.last.x;
        const dy = p.clientY - this.last.y;
        this.last = { x: p.clientX, y: p.clientY };
        this.group.rotation.y += dx * 0.008;
        this.group.rotation.x += dy * 0.008;
        this.spin = 0;
      };
      const up = () => { this.dragging = false; this.spin = 0.0035; };

      canvas.addEventListener("pointerdown", down);
      canvas.addEventListener("pointermove", move);
      canvas.addEventListener("pointerup", up);
      canvas.addEventListener("pointercancel", up);
      canvas.addEventListener("pointerleave", up);
      canvas.addEventListener("wheel", event => {
        event.preventDefault();
        this.zoom = Math.min(11, Math.max(4.4, this.zoom + Math.sign(event.deltaY) * 0.55));
        this.camera.position.z = this.zoom;
      }, { passive: false });

      resetButton.addEventListener("click", () => this.reset());
    }

    reset() {
      this.group.rotation.set(0, 0, 0);
      this.zoom = 6.9;
      this.camera.position.z = this.zoom;
      this.spin = 0.0035;
    }

    clear() {
      while (this.group.children.length) {
        const child = this.group.children.pop();
        child.geometry?.dispose?.();
        child.material?.dispose?.();
      }
    }

    show(id) {
      const data = MOLECULES[id];
      if (!data) return;
      const THREE = this.THREE;
      this.clear();
      const atoms = [];

      data.atoms.forEach((entry, index) => {
        if (data.cluster) {
          const [x, y, z, radius, color] = entry;
          const geometry = new THREE.SphereGeometry(radius, 28, 22);
          const material = new THREE.MeshStandardMaterial({
            color, roughness: .92, metalness: .02, transparent: true, opacity: .95,
          });
          const mesh = new THREE.Mesh(geometry, material);
          mesh.position.set(x, y, z);
          this.group.add(mesh);
          atoms.push({ mesh, pos: new THREE.Vector3(x, y, z), radius });
          return;
        }
        const [x, y, z, element] = entry;
        const spec = ATOM[element] || ATOM.C;
        const geometry = new THREE.SphereGeometry(spec.size, 32, 24);
        const material = new THREE.MeshStandardMaterial({
          color: spec.color, roughness: .38, metalness: .06,
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(x, y, z);
        this.group.add(mesh);
        atoms.push({ mesh, pos: new THREE.Vector3(x, y, z), radius: spec.size });
      });

      (data.bonds || []).forEach(([a, b, order]) => {
        const start = atoms[a].pos;
        const end = atoms[b].pos;
        const axis = new THREE.Vector3().subVectors(end, start);
        const length = axis.length();
        const unit = axis.clone().normalize();
        const helper = Math.abs(unit.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
        const side = new THREE.Vector3().crossVectors(unit, helper).normalize();

        const offsets = order === 3 ? [-0.15, 0, 0.15] : order === 2 ? [-0.11, 0.11] : [0];
        offsets.forEach(offset => {
          const geometry = new THREE.CylinderGeometry(0.085, 0.085, Math.max(0.1, length - 0.32), 16);
          const material = new THREE.MeshStandardMaterial({ color: "#a7bdb1", roughness: .55, metalness: .05 });
          const bar = new THREE.Mesh(geometry, material);
          const mid = new THREE.Vector3().addVectors(start, end).multiplyScalar(.5).addScaledVector(side, offset);
          bar.position.copy(mid);
          bar.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), unit);
          this.group.add(bar);
        });
      });

      // Frame the molecule: scale it to a comfortable size in the stage.
      let radius = 1;
      atoms.forEach(atom => { radius = Math.max(radius, atom.pos.length() + atom.radius); });
      const scale = (data.cluster ? 2.15 : 2.35) / radius;
      this.group.scale.setScalar(scale);
      this.group.rotation.set(0.18, -0.35, 0);
      this.zoom = 7.2;
      this.camera.position.z = this.zoom;
    }

    loop() {
      const tick = () => {
        if (!this.dragging) this.group.rotation.y += this.spin;
        this.group.rotation.x += Math.sin(performance.now() * 0.0004) * 0.0006;
        this.renderer.render(this.scene, this.camera);
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }
  }

  function drawFallbackSvg() {
    canvas.style.display = "none";
    fallback.style.display = "grid";
    fallback.innerHTML = `
      <svg viewBox="0 0 240 200" role="img" aria-label="Simplified pollutant structure">
        <circle cx="120" cy="96" r="34" fill="#d3ab3d" opacity=".9"/>
        <circle cx="66" cy="58" r="26" fill="#cf6f63" opacity=".9"/>
        <circle cx="176" cy="62" r="26" fill="#cf6f63" opacity=".9"/>
        <path d="M120 96 70 62M120 96 172 66" stroke="#a7bdb1" stroke-width="6" stroke-linecap="round" opacity=".8"/>
        <text x="120" y="184" fill="#8b9c92" text-anchor="middle" font-family="sans-serif" font-size="10">3D unavailable in this browser</text>
      </svg>`;
  }

  render();
  import("https://unpkg.com/three@0.160.0/build/three.module.js")
    .then(THREE => {
      viewer = new Viewer(THREE);
      viewer.show(active.id);
      renderDetails();
    })
    .catch(drawFallbackSvg);

})();
</script>
</body>
</html>
